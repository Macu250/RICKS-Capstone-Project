<!DOCTYPE html>
<html lang="en">
<head>
<title>RICKSProject</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

/* Style of the top navigation bar */
.topnav {
  overflow: hidden;
  background-color: #333;
}

/* Style of the topnav links */
.topnav a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

/* Change color on hover */
.topnav a:hover {
  background-color: #ddd;
  color: black;
}

/* Style the content */
.content {
  background-color: #ddd;
  padding: 10px;
  height: 400px; /* This extends the main area to pop the footer down. Will be used to hopefully 
  Keep track of the footer perhaps based on screen size?*/
}

/* Style the footer */
.footer {
  background-color: #f1f1f1;
  padding: 10px;
}
</style>
</head>
<body>

<div class="topnav">
  <a href="#">Maybe</a>
  <a href="#">links</a>
  <a href="#">Up here?</a>
</div>

<div class="content">
  <h2>Main Content</h2>
  <p>Or maybe in a list here</p>
</div>

<div class="footer">
  <p>Footer that can have various different things</p>
</div>

</body>
</html>
